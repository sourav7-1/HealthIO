name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest --cov --cov-report=term-missing

  api-contract:
    name: OpenAPI client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:client
      - name: Fail if generated files changed
        run: git diff --exit-code -- packages/api-client

  web:
    name: Web + packages (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build
        env:
          TURBO_TELEMETRY_DISABLED: 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-integration:
    name: API integration (postgres, redis, minio)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: |
          docker compose -f docker-compose.dev.yml up -d --wait postgres redis minio
          docker compose -f docker-compose.dev.yml run --rm minio-init
      - working-directory: apps/api
        run: |
          cp .env.example .env
          uv sync --frozen
          uv run alembic upgrade head
          uv run alembic check          # models and migrations must not drift
          uv run alembic downgrade base # every migration must be reversible
          uv run alembic upgrade head
          HIO_INTEGRATION=1 uv run pytest -m integration
      - if: always()
        run: docker compose -f docker-compose.dev.yml down -v
