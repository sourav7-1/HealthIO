# Install once: uvx pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (api)
        entry: bash -c 'cd apps/api && uv run ruff format --check .'
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false
      - id: ruff
        name: ruff check (api)
        entry: bash -c 'cd apps/api && uv run ruff check .'
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (api)
        entry: bash -c 'cd apps/api && uv run mypy app tests scripts'
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false
      - id: web-lint
        name: eslint + tsc (js)
        entry: pnpm turbo run lint typecheck
        language: system
        files: ^(apps/web|packages)/.*\.(ts|tsx|mjs)$
        pass_filenames: false
