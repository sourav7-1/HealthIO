<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" fill="none">
  <defs>
    <linearGradient id="hio-logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062ea" />
      <stop offset="32%" stop-color="#027bf3" />
      <stop offset="68%" stop-color="#00a8b5" />
      <stop offset="100%" stop-color="#00bca2" />
    </linearGradient>
    <linearGradient id="hio-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009db0" />
      <stop offset="100%" stop-color="#00bda0" />
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(2, 1)">
    <!-- Left Pillar -->
    <rect x="0" y="0" width="70" height="177" rx="35" fill="url(#hio-logo-grad)" />
    <!-- Right Pillar -->
    <rect x="106" y="0" width="70" height="177" rx="35" fill="url(#hio-logo-grad)" />
    <!-- Center Arched Bridge -->
    <path d="M 64 68 C 72 53, 104 53, 112 68 L 112 127 C 104 138, 72 138, 64 127 Z" fill="url(#hio-logo-grad)" />
    <!-- Plus Symbol -->
    <rect x="132" y="22" width="30" height="9" rx="4.5" fill="#ffffff" />
    <rect x="142.5" y="11.5" width="9" height="30" rx="4.5" fill="#ffffff" />
    <!-- ECG Heartbeat Line -->
    <path d="M 0 94 L 56 94 L 67 111 L 84 69 L 99 115 L 109 94 L 176 94" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Main title "HealthIO" -->
    <text x="210" y="115" font-size="96" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#0a1936">Health</tspan><tspan fill="url(#hio-text-grad)">IO</tspan>
    </text>
    <!-- Tagline -->
    <text x="214" y="148" font-size="19" font-weight="500" fill="#334155" letter-spacing="0.2">
      Intelligent Healthcare &amp; Medication Management Platform
    </text>
  </g>
</svg>

